name: Validar Edge Functions TEU7VD

on:
  push:
    branches:
      - preparacao-homologacao
  pull_request:
    branches:
      - main
      - preparacao-homologacao
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    name: Verificação estática Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testar contrato de validação de reservas
        run: deno test supabase/tests/reservation-validation.test.ts

      - name: Validar sintaxe do frontend
        run: node --check assets/app.js

      - name: Garantir que o envio público continua bloqueado
        shell: bash
        run: |
          grep -q '<button type="button" disabled>Reservas ainda não liberadas</button>' index.html
          ! grep -Eq 'functions/v1/criar-reserva|fetch\([^)]*criar-reserva' assets/app.js
          grep -q 'data-sitekey="0x4AAAAAAFnEzhpEH4Texj_-' index.html

      - name: Validar sintaxe dos smoke tests HTTP
        run: bash -n supabase/tests/edge-input-smoke.sh supabase/tests/security-smoke.sh

      - name: Verificar criar-reserva
        run: deno check supabase/functions/criar-reserva/index.ts

      - name: Verificar listar-reservas
        run: deno check supabase/functions/listar-reservas/index.ts

      - name: Verificar admin-reservas
        run: deno check supabase/functions/admin-reservas/index.ts

  runtime-smoke:
    name: Smoke HTTP real sem mutações
    # Não chamar o backend real a partir de pull requests de terceiros.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Executar testes negativos contra as Edge Functions implantadas
        env:
          SUPABASE_URL: https://emwnytvlbpgiwqswojze.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_gKuJbxS6UBnsodjgdasDIQ_G2k_FL31
          TEU7VD_ALLOWED_ORIGIN: https://dihjanssencoelho-svg.github.io
        run: bash supabase/tests/edge-input-smoke.sh

  browser-smoke:
    name: Smoke do portal no navegador
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verificar portal publicado sem enviar reservas
        run: node supabase/tests/browser-smoke.mjs
