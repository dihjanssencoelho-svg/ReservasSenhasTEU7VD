name: Validar Edge Functions TEU7VD

on:
  push:
    branches:
      - preparacao-homologacao
  pull_request:
    branches:
      - main
      - preparacao-homologacao
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    name: Verificação estática Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testar contrato de validação de reservas
        run: deno test supabase/tests/reservation-validation.test.ts

      - name: Validar sintaxe do frontend
        run: node --check assets/app.js

      - name: Garantir que o envio público continua bloqueado
        shell: bash
        run: |
          grep -q '<button type="button" disabled>Reservas ainda não liberadas</button>' index.html
          ! grep -Eq 'functions/v1/criar-reserva|fetch\([^)]*criar-reserva' assets/app.js
          grep -q 'data-sitekey="0x4AAAAAAFnEzhpEH4Texj_-' index.html

      - name: Validar sintaxe dos smoke tests HTTP
        run: bash -n supabase/tests/edge-input-smoke.sh supabase/tests/security-smoke.sh supabase/tests/reservation-concurrency-smoke.sh

      - name: Verificar criar-reserva
        run: deno check supabase/functions/criar-reserva/index.ts

      - name: Verificar listar-reservas
        run: deno check supabase/functions/listar-reservas/index.ts

      - name: Verificar admin-reservas
        run: deno check supabase/functions/admin-reservas/index.ts

  reservation-flow-integration:
    name: Integração local de reservas (rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Iniciar Supabase local e aplicar migrações
        run: |
          supabase start
          supabase db reset

      - name: Testar criação, duplicidade, capacidade, numeração, auditoria e rollback atômico
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/reservation-flow.test.sql

      - name: Auditar RLS e privilégios mínimos no banco local
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $security$
          declare t text; v_rls boolean;
          begin
            foreach t in array array['giras','reservas','perfis_admin','auditoria','contadores_senha'] loop
              select c.relrowsecurity into v_rls
              from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relname=t;
              if coalesce(v_rls,false) is not true then
                raise exception 'RLS desabilitado ou tabela ausente: public.%',t;
              end if;
            end loop;
            if has_table_privilege('anon','public.reservas','SELECT')
              or has_table_privilege('anon','public.reservas','INSERT')
              or has_table_privilege('authenticated','public.reservas','SELECT')
              or has_table_privilege('authenticated','public.reservas','INSERT')
              or has_table_privilege('anon','public.auditoria','SELECT')
              or has_table_privilege('authenticated','public.auditoria','SELECT')
              or has_table_privilege('anon','public.contadores_senha','SELECT')
              or has_table_privilege('authenticated','public.contadores_senha','SELECT') then
              raise exception 'Privilégio direto indevido em reservas, auditoria ou contadores';
            end if;
            if has_table_privilege('anon','public.perfis_admin','SELECT') then
              raise exception 'Papel anon pode consultar perfis_admin';
            end if;
            if has_table_privilege('anon','public.giras','INSERT')
              or has_table_privilege('anon','public.giras','UPDATE')
              or has_table_privilege('anon','public.giras','DELETE')
              or has_table_privilege('authenticated','public.giras','INSERT')
              or has_table_privilege('authenticated','public.giras','UPDATE')
              or has_table_privilege('authenticated','public.giras','DELETE') then
              raise exception 'Mutação direta de giras concedida a anon/authenticated';
            end if;
            if has_function_privilege('anon','public.teu7vd_criar_reserva(uuid,text,date,text,text,text,boolean,text,text,text)','EXECUTE')
              or has_function_privilege('authenticated','public.teu7vd_criar_reserva(uuid,text,date,text,text,text,boolean,text,text,text)','EXECUTE') then
              raise exception 'RPC de criação acessível diretamente a anon/authenticated';
            end if;
            if not has_function_privilege('service_role','public.teu7vd_criar_reserva(uuid,text,date,text,text,text,boolean,text,text,text)','EXECUTE') then
              raise exception 'service_role sem EXECUTE na RPC de criação';
            end if;
            raise notice 'PASSOU: RLS ativo e privilégios diretos mínimos verificados';
          end;
          $security$;
          SQL

      - name: Confirmar que RPCs administrativas rejeitam sessão sem perfil admin
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $privileges$
          begin
            if not has_function_privilege('authenticated','public.teu7vd_cancelar_reserva(uuid,text)','EXECUTE')
              or not has_function_privilege('authenticated','public.teu7vd_excluir_reserva(uuid,text)','EXECUTE')
              or not has_function_privilege('authenticated','public.teu7vd_reabrir_reserva(uuid,text)','EXECUTE') then
              raise exception 'Teste inválido: authenticated precisa ter EXECUTE nas RPCs para validar a proteção interna de admin';
            end if;
          end;
          $privileges$;
          begin;
          set local role authenticated;
          do $guard$
          begin
            begin
              perform public.teu7vd_cancelar_reserva('00000000-0000-4000-8000-000000000001'::uuid, 'teste sem admin');
              raise exception 'Falha de segurança: cancelamento aceito sem perfil admin';
            exception when sqlstate '42501' then
              null;
            end;
            begin
              perform public.teu7vd_excluir_reserva('00000000-0000-4000-8000-000000000001'::uuid, 'teste sem admin');
              raise exception 'Falha de segurança: exclusão aceita sem perfil admin';
            exception when sqlstate '42501' then
              null;
            end;
            begin
              perform public.teu7vd_reabrir_reserva('00000000-0000-4000-8000-000000000001'::uuid, 'teste sem admin');
              raise exception 'Falha de segurança: reabertura aceita sem perfil admin';
            exception when sqlstate '42501' then
              null;
            end;
            raise notice 'PASSOU: RPCs administrativas recusaram sessão autenticada sem perfil admin';
          end;
          $guard$;
          rollback;
          SQL

      - name: Testar fluxo administrativo positivo com fixtures locais e rollback
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/admin-reservation-flow.test.sql

      - name: Testar concorrência de numeração e capacidade
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Execução de concorrência $attempt/5"
            bash supabase/tests/reservation-concurrency-smoke.sh
          done

  runtime-smoke:
    name: Smoke HTTP real sem mutações
    # Não chamar o backend real a partir de pull requests de terceiros.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Executar testes negativos contra as Edge Functions implantadas
        env:
          SUPABASE_URL: https://emwnytvlbpgiwqswojze.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_gKuJbxS6UBnsodjgdasDIQ_G2k_FL31
          TEU7VD_ALLOWED_ORIGIN: https://dihjanssencoelho-svg.github.io
        run: bash supabase/tests/edge-input-smoke.sh

  browser-smoke:
    name: Smoke do portal no navegador
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Verificar portal publicado sem enviar reservas
        run: node supabase/tests/browser-smoke.mjs
